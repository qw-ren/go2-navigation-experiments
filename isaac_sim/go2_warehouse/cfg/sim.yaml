defaults:
  - _self_

num_envs: 1
freq: 40 # can only be divisible by 200
camera_follow: True
env_name: obstacle-dense
# env_name: full-warehouse

sensor:
  enable_lidar: True
  enable_camera: True
  color_image: True
  depth_image: True
  semantic_segmentation: True

sim_app:
  anti_aliasing: 0
  width: 1280
  height: 720
  hide_ui: False

# Static transform map->odom used by the bridge.
# Tune these values if map and simulation are offset.
map_to_odom:
  x: 0.0
  y: 0.0
  z: 0.0
  yaw: 0.0