# Transport waypoint region, not precision docking: 0.4m position, unconstrained heading.
# Collision, control limits, progress checker and safety gateway unchanged.
# Cruise acceptance remains >=.6m/s; permit slowing/zero linear speed for turns and arrival.
# A: prioritize obstacle cost and detour tracking; all speed/guard limits preserved.
# A: conservative .60m radius exceeds unchanged guard .55m threshold.
# Same DWB limits; native path-validity BT plugins added.
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    odom_topic: /unitree_go2/odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.2
      movement_time_allowance: 15.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.40
      yaw_goal_tolerance: 3.141592653589793
      stateful: true
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: true
      min_vel_x: 0.0
      max_vel_x: 0.8
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 0.6
      min_speed_xy: 0.0
      max_speed_xy: 0.8
      min_speed_theta: 0.0
      acc_lim_x: 3.5
      acc_lim_y: 0.0
      acc_lim_theta: 2.0
      decel_lim_x: -3.5
      decel_lim_y: 0.0
      decel_lim_theta: -2.0
      vx_samples: 12
      vy_samples: 1
      vtheta_samples: 21
      sim_time: 2.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.3
      xy_goal_tolerance: 0.40
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: [RotateToGoal, Oscillation, BaseObstacle, GoalAlign, PathAlign, PathDist, GoalDist]
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
      BaseObstacle.scale: 0.20
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 0.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 64.0
      GoalDist.scale: 24.0
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: unitree_go2/base_link
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.3
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      robot_radius: 0.60
      always_send_full_costmap: true
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          inf_is_valid: true
          max_obstacle_height: 1.2
          obstacle_max_range: 8.0
          raytrace_max_range: 12.0
          obstacle_min_range: 0.3
          raytrace_min_range: 0.3
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 1.00
        cost_scaling_factor: 3.0
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: unitree_go2/base_link
    odom_topic: /unitree_go2/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    plugin_lib_names: [nav2_is_path_valid_condition_bt_node, nav2_globally_updated_goal_condition_bt_node, nav2_compute_path_to_pose_action_bt_node, nav2_compute_path_through_poses_action_bt_node, nav2_follow_path_action_bt_node, nav2_rate_controller_bt_node, nav2_pipeline_sequence_bt_node]
lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    bond_timeout: 8.0
    node_names: [controller_server, bt_navigator]
