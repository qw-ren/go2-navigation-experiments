# A: conservative .60m radius exceeds unchanged guard .55m threshold.
# M3: saved map remains immutable; live scan updates only the costmap.
map_server:
  ros__parameters:
    use_sim_time: true
    frame_id: map
    topic_name: map

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.05
      use_astar: false
      allow_unknown: false

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: unitree_go2/base_link
      update_frequency: 2.0
      publish_frequency: 1.0
      resolution: 0.05
      # Conservative provisional radius; not full Go2 geometry certification.
      robot_radius: 0.60
      rolling_window: false
      track_unknown_space: true
      always_send_full_costmap: true
      transform_tolerance: 0.3
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          inf_is_valid: true
          max_obstacle_height: 1.2
          obstacle_max_range: 8.0
          raytrace_max_range: 12.0
          obstacle_min_range: 0.3
          raytrace_min_range: 0.3
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 1.00
        cost_scaling_factor: 3.0

lifecycle_manager_plan:
  ros__parameters:
    use_sim_time: true
    autostart: true
    bond_timeout: 8.0
    node_names: [map_server, planner_server]
